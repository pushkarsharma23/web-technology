<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCET Jammu - Student Login</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <main class="login-page">
        <div class="login-box">
            <a href="index.html"><img class="login-logo" src="https://gcetj.ac.in/logo.jpg" alt="GCET Jammu Logo"></a>
            <h1>GCET Jammu</h1>
            <p class="subtitle">Student Portal | Autonomous College</p>

            <h2>Student Login</h2>
            <form action="dashboard.html">
                <div class="input-group">
                    <span class="input-icon"></span>
                    <input type="text" placeholder="Enter Roll Number" required>
                </div>
                <div class="input-group">
                    <span class="input-icon"></span>
                    <input type="password" placeholder="Enter Password" required>
                </div>

                <div class="login-options">
                    <label><input type="checkbox"> Remember Me</label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button class="primary-btn" type="submit">Login</button>
            </form>
            <p class="login-note">Demo portal for Web Technology project</p>
        </div>
    </main>
<p style="text-align:center;margin:20px;"><a href="../index.html">🏠 College Website</a></p>
</body>
</html>
