<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Settings - GCET Student Portal</title>
        <link rel="stylesheet" href="style2.css">
    </head>
    <body>
        <header class="topbar">
            <a href="../index.html" class="brand">
                <img src="https://gcetj.ac.in/logo.jpg" alt="GCET Logo">
                <div>
                    <h1>GCET Jammu</h1>
                    <p>Student Portal</p>
                </div>
            </a>
            <div class="top-right">
                <span class="notification"></span>
                <div class="student-mini">
                    <div class="avatar">PS</div>
                    <div>
                        <strong>Pushkar Sharma</strong>
                        <small>2512051 ▾</small>
                    </div>
                </div>
            </div>
        </header>
        <div class="layout">
            <aside class="sidebar">
                <span class="sidebar-title">Main Menu</span>
                <a href="dashboard.html"> Dashboard</a>
                <a href="profile.html"> My Profile</a>
                <a href="courses.html"> My Courses</a>
                <a href="results.html"> My Results</a>
                <a href="notices.html">Notice Board</a>
                <a class="active" href="settings.html"> Settings</a>
                <a href="index.html"> Logout</a>
            </aside>
            <main class="content">
                <div class="page-title">
                    <h2>Settings</h2>
                    <p>Manage your basic portal preferences</p>
                </div>
                <section class="panel settings-form">
                    <h3>Account Settings</h3>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" value="student@gcetjammu.ac.in">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" value="+91 XXXXX XXXXX">
                    </div>
                    <div class="form-group">
                        <label>Notification Preference</label>
                        <select>
                            <option>All Notifications</option>
                            <option>Important Only</option>
                            <option>None</option>
                        </select>
                    </div>
                    <button class="small-btn" type="button">Save Changes</button>
                </section>
            </main>
        </div>
        <p style="text-align:center;margin:20px;">
            <a href="../index.html"> College Website</a>
        </p>
    </body>
</html>
